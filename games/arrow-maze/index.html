<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>Arrow Maze</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="control back" href="../../" aria-label="Back"><span aria-hidden="true">←</span><span>Back</span></a>
      <div class="brand" aria-label="Arrow Maze"><span aria-hidden="true">✦</span><span>Arrow Maze</span></div>
      <div class="top-actions">
        <button id="settings-btn" class="control" type="button" aria-label="Settings" aria-haspopup="dialog"><span aria-hidden="true">⚙</span><span class="settings-label">Settings</span></button>
      </div>
    </header>

    <section id="hud" aria-label="Game status and controls">
      <div class="hud-left">
        <button class="hud-level" id="btn-level" title="Change level">Level <span id="level">1</span><span class="lvl-caret">⌄</span></button>
      </div>
      <div class="hud-center">
        <div class="stat">
          <span class="stat-label">Strikes</span>
          <div id="hearts" class="hearts"></div>
        </div>
        <div class="stat">
          <span class="stat-label">Arrows left</span>
          <span id="arrows-left" class="stat-value">0</span>
        </div>
      </div>
      <div class="hud-right">
        <button id="btn-reset-view" class="icon-btn" title="Reset view" aria-label="Reset view">⤢</button>
        <button id="btn-new" class="text-btn" title="New board at this level"><span class="new-wide">New&nbsp;Board</span><span class="new-short">New</span></button>
      </div>
    </section>

    <main id="stage">
      <canvas id="board"></canvas>
      <div id="zoom-hint" class="zoom-hint">scroll / pinch to zoom · drag to pan</div>
    </main>

    <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
      <div class="modal" id="modal">
        <h2 id="modal-title">Level cleared</h2>
        <p id="modal-body">Nice and tidy.</p>
        <div class="modal-actions" id="modal-actions"></div>
      </div>
    </div>

    <div id="level-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="level-title" aria-hidden="true">
      <div class="modal">
        <h2 id="level-title">Go to level</h2>
        <p>Jump to any level. Bigger levels are bigger, busier boards.</p>
        <div class="level-chips" id="level-chips">
          <button data-lvl="1">1</button>
          <button data-lvl="25">25</button>
          <button data-lvl="50">50</button>
          <button data-lvl="100">100</button>
          <button data-lvl="200">200</button>
        </div>
        <div class="level-input-row">
          <button id="lvl-minus" class="step" aria-label="Lower">–</button>
          <input id="lvl-input" type="number" min="1" max="999" inputmode="numeric" />
          <button id="lvl-plus" class="step" aria-label="Higher">+</button>
        </div>
        <div class="modal-actions">
          <button id="lvl-go" class="primary">Go</button>
          <button id="lvl-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <div id="settings-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title" aria-hidden="true">
      <div class="modal settings-modal">
        <div class="modal-head">
          <h2 id="settings-title">Settings</h2>
          <button id="settings-close" class="close" type="button" aria-label="Close settings">×</button>
        </div>
        <label class="setting-row">
          <span><strong>Sound effects</strong><small>Movement, strikes, and celebrations</small></span>
          <input id="sound-toggle" type="checkbox" checked />
        </label>
        <p class="settings-note">Reset View and New Board stay in the game toolbar for quick access.</p>
      </div>
    </div>
  </div>

  <script src="generator.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
